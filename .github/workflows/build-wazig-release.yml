name: build-wazig-release

on:
  push:
    tags:
      - 'v*-wazig.*'
      - 'v*-wazigl.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload assets to (e.g. v0.17.0-wazig.1 or v0.17.0-wazigl.1)'
        required: true
        default: 'v0.17.0-wazig.1'
        type: string

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.0"
  LLVM_VERSION: "22.1.8-p1"
  # Requires ghr with cataggar/ghr#251 (.tar.zst.ghr archive sidecar + ${GHR_TOOL_DIR} expansion)
  GHR_VERSION: "v0.10.2"
  WASMTIME_VERSION: "v50.0.1"

jobs:
  build-and-release:
    name: "Build and release ${{ inputs.tag || github.ref_name }}"
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-latest' }}
    steps:
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            *-wazigl.*)
              FLAVOR="wazigl"
              ;;
            *-wazig.*)
              FLAVOR="wazig"
              ;;
            *)
              echo "ERROR: Tag '$TAG' must match *-wazig.* or *-wazigl.*"
              exit 1
              ;;
          esac
          VERSION_STRING="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "flavor=${FLAVOR}" >> "$GITHUB_OUTPUT"
          echo "version_string=${VERSION_STRING}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ghr and wasmtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/cataggar/ghr/main/install.sh \
            | GHR_VERSION="${{ env.GHR_VERSION }}" GHR_NO_PATH_ADD=1 sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ghr install "bytecodealliance/wasmtime@${{ env.WASMTIME_VERSION }}"
          wasmtime --version

      - name: Download host Zig
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/cataggar/zig/releases/download/v${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -sSfL "$URL" | tar -xJ -C "$RUNNER_TEMP"
          echo "HOST_ZIG=$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}/zig" >> "$GITHUB_ENV"

      - name: Download LLVM archives (wazigl only)
        if: steps.meta.outputs.flavor == 'wazigl'
        shell: bash
        run: |
          set -euo pipefail
          HOST_LLVM_URL="https://github.com/cataggar/llvm/releases/download/llvm-zig-${LLVM_VERSION}/llvm-zig-${LLVM_VERSION}-x86_64-linux.tar.xz"
          WASM_LLVM_URL="https://github.com/cataggar/llvm/releases/download/llvm-zig-${LLVM_VERSION}/llvm-zig-${LLVM_VERSION}-wasm64-wasi.tar.xz"
          curl -sSfL "$HOST_LLVM_URL" | tar -xJ -C "$RUNNER_TEMP"
          curl -sSfL "$WASM_LLVM_URL" | tar -xJ -C "$RUNNER_TEMP"
          echo "HOST_LLVM_PREFIX=$RUNNER_TEMP/llvm-zig-${LLVM_VERSION}-x86_64-linux" >> "$GITHUB_ENV"
          echo "WASM_LLVM_PREFIX=$RUNNER_TEMP/llvm-zig-${LLVM_VERSION}-wasm64-wasi" >> "$GITHUB_ENV"

      - name: Build stage3-host and wazig.wasm
        if: steps.meta.outputs.flavor == 'wazig'
        shell: bash
        run: |
          set -euxo pipefail
          ZIG_LIB_DIR="$PWD/lib" "$HOST_ZIG" build \
            --prefix "$RUNNER_TEMP/stage3-host" \
            -Denable-llvm=false \
            -Duse-llvm=true \
            -Doptimize=ReleaseFast \
            -Dno-langref

          "$RUNNER_TEMP/stage3-host/bin/zig" build \
            --prefix "$RUNNER_TEMP/stage3-wazig" \
            -Dtarget=wasm64-wasip3 \
            -Denable-llvm=false \
            -Duse-llvm=false \
            -Doptimize=ReleaseSafe \
            -Dstrip \
            -Dno-langref \
            -Dversion-string="${{ steps.meta.outputs.version_string }}"

      - name: Build stage3-host and wazigl.wasm
        if: steps.meta.outputs.flavor == 'wazigl'
        shell: bash
        run: |
          set -euxo pipefail
          ZIG_LIB_DIR="$PWD/lib" "$HOST_ZIG" build \
            --prefix "$RUNNER_TEMP/stage3-host" \
            --search-prefix "$HOST_LLVM_PREFIX" \
            -Denable-llvm=true \
            -Dstatic-llvm \
            -Duse-zig-libcxx \
            -Doptimize=ReleaseFast \
            -Dstrip \
            -Dno-langref

          "$RUNNER_TEMP/stage3-host/bin/zig" build \
            --prefix "$RUNNER_TEMP/stage3-wazigl" \
            --search-prefix "$WASM_LLVM_PREFIX" \
            -Dtarget=wasm64-wasip3 \
            -Denable-llvm=true \
            -Dstatic-llvm \
            -Duse-llvm=false \
            -Duse-zig-libcxx \
            -Doptimize=ReleaseSafe \
            -Dstrip \
            -Dno-langref \
            -Dversion-string="${{ steps.meta.outputs.version_string }}"

      - name: Package .tar.zst bundle, write .tar.zst.ghr sidecar, and smoke-test with wasmtime
        shell: bash
        run: |
          set -euxo pipefail
          FLAVOR="${{ steps.meta.outputs.flavor }}"
          rm -rf dist
          python3 scripts/package_wazig_bundle.py \
            --flavor "$FLAVOR" \
            --stage-prefix "$RUNNER_TEMP/stage3-${FLAVOR}" \
            --out-dir dist
          ls -lh "dist/${FLAVOR}.tar.zst" "dist/${FLAVOR}.tar.zst.ghr"

          BUNDLE_DIR="$RUNNER_TEMP/extracted-${FLAVOR}"
          SMOKE_DIR="$RUNNER_TEMP/smoke-${FLAVOR}"
          rm -rf "$BUNDLE_DIR" "$SMOKE_DIR"
          mkdir -p "$BUNDLE_DIR" "$SMOKE_DIR"
          zstd -dc "dist/${FLAVOR}.tar.zst" | tar -C "$BUNDLE_DIR" -xf -

          WASMTIME_ARGS=(
            run
            -W component-model-memory64=y
            -W component-model-async=y
            -W component-model-async-stackful=y
            -W component-model-more-async-builtins=y
            -W component-model-error-context=y
            -W max-wasm-stack=67108864
            -W async-stack-size=67108864
            -S p3=y
            -S cli-exit-with-code=y
            -S inherit-env=y
            "--dir=${BUNDLE_DIR}/lib::/lib"
            --dir=.
          )

          (
            cd "$SMOKE_DIR"
            unset ZIG_LIB_DIR ZIG_GLOBAL_CACHE_DIR ZIG_LOCAL_CACHE_DIR

            ACTUAL_VER="$(wasmtime "${WASMTIME_ARGS[@]}" "${BUNDLE_DIR}/${FLAVOR}.wasm" version)"
            echo "Reported version: ${ACTUAL_VER}"
            test "${ACTUAL_VER}" = "${{ steps.meta.outputs.version_string }}"

            cat > smoke.zig <<'EOF'
          const std = @import("std");
          extern "c" fn abs(x: c_int) c_int;
          pub fn main() void {
              std.debug.assert(abs(-42) == 42);
              std.debug.print("smoke ok\n", .{});
          }
          test "bundled test_runner smoke" {
              try std.testing.expectEqual(@as(c_int, 42), abs(-42));
          }
          EOF
            wasmtime "${WASMTIME_ARGS[@]}" "${BUNDLE_DIR}/${FLAVOR}.wasm" build-exe \
              smoke.zig \
              -lc \
              -target wasm32-wasi \
              -fno-llvm \
              -femit-bin=smoke.wasm
            wasmtime run smoke.wasm

            wasmtime "${WASMTIME_ARGS[@]}" "${BUNDLE_DIR}/${FLAVOR}.wasm" test \
              smoke.zig \
              --test-no-exec \
              -lc \
              -target wasm32-wasi \
              -fno-llvm \
              -femit-bin=smoke_test.wasm
            wasmtime run smoke_test.wasm

            if [ "$FLAVOR" = "wazigl" ]; then
              cat > helper.c <<'EOF'
          #include <stdlib.h>
          #include <stdint.h>
          #include <wasm_simd128.h>
          int32_t c_helper(int32_t x) { return abs(x); }
          EOF
              wasmtime "${WASMTIME_ARGS[@]}" "${BUNDLE_DIR}/${FLAVOR}.wasm" build-exe \
                smoke.zig \
                helper.c \
                -lc \
                -target wasm32-wasi \
                -fllvm \
                -O ReleaseSafe \
                -femit-bin=smoke_llvm.wasm
              wasmtime run smoke_llvm.wasm
            fi

            # Verify --zig-lib-dir precedence overrides /lib and fails on invalid override.
            cp -r "${BUNDLE_DIR}/lib" custom-lib
            wasmtime "${WASMTIME_ARGS[@]}" "${BUNDLE_DIR}/${FLAVOR}.wasm" build-exe \
              smoke.zig \
              --zig-lib-dir custom-lib \
              -lc \
              -target wasm32-wasi \
              -fno-llvm \
              -femit-bin=smoke_override.wasm
            wasmtime run smoke_override.wasm
            if wasmtime "${WASMTIME_ARGS[@]}" "${BUNDLE_DIR}/${FLAVOR}.wasm" build-exe \
              smoke.zig \
              --zig-lib-dir nonexistent-zig-lib \
              -target wasm32-wasi \
              -fno-llvm \
              -femit-bin=smoke_bad.wasm; then
              echo "ERROR: Expected invalid --zig-lib-dir override to fail" >&2
              exit 1
            fi
          )
          rm -rf "$BUNDLE_DIR" "$SMOKE_DIR"

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          FLAVOR: ${{ steps.meta.outputs.flavor }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FLAVOR" = "wazigl" ]; then
            DESC="Zig compiler (\`wazigl\`) compiled for \`wasm64-wasip3\` with the LLVM/Clang/LLD backend statically linked in, bundled with a Wasm-focused \`lib/\` subset in \`wazigl.tar.zst\`."
          else
            DESC="Zig compiler (\`wazig\`) compiled for \`wasm64-wasip3\` (self-hosted backends, without LLVM), bundled with a Wasm-focused \`lib/\` subset in \`wazig.tar.zst\`."
          fi

          NOTES="${DESC}

          This release publishes unsigned \`${FLAVOR}.tar.zst\` and \`${FLAVOR}.tar.zst.ghr\` assets (no \`.minisig\` signature sidecar).

          Install using [ghr](https://github.com/cataggar/ghr):

          \`\`\`sh
          ghr install ${GITHUB_REPOSITORY}@${TAG}
          \`\`\`"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Zig $TAG" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zig $TAG" \
              --notes "$NOTES"
          fi

          shopt -s nullglob
          MINISIG_FILES=(dist/*.minisig)
          if [ "${#MINISIG_FILES[@]}" -ne 0 ]; then
            echo "ERROR: Unexpected .minisig files in dist/: ${MINISIG_FILES[*]}" >&2
            exit 1
          fi

          ASSETS=("dist/${FLAVOR}.tar.zst" "dist/${FLAVOR}.tar.zst.ghr")
          for asset in "${ASSETS[@]}"; do
            test -f "$asset"
          done
          gh release upload "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          EXISTING_ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for obsolete in \
            "${FLAVOR}.wasm" \
            "${FLAVOR}.wasm.zst" \
            "${FLAVOR}.wasm.zstd" \
            "${FLAVOR}.wasm.ghr" \
            "${FLAVOR}.wasm.minisig" \
            "${FLAVOR}.tar.zst.minisig"; do
            if printf '%s\n' "$EXISTING_ASSETS" | grep -Fxq "$obsolete"; then
              gh release delete-asset "$TAG" "$obsolete" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Verify ghr install from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          FLAVOR: ${{ steps.meta.outputs.flavor }}
        shell: bash
        run: |
          set -euxo pipefail
          VERIFY_DIR="$RUNNER_TEMP/verify install ${FLAVOR}"
          VERIFY_PROJ="$RUNNER_TEMP/verify-proj-${FLAVOR}"
          rm -rf "$VERIFY_DIR" "$VERIFY_PROJ"
          mkdir -p "$VERIFY_DIR" "$VERIFY_PROJ"
          GHR_HOME="$VERIFY_DIR/ghr home" ghr install "${GITHUB_REPOSITORY}@${TAG}"
          INSTALLED_CMD="$VERIFY_DIR/ghr home/bin/${FLAVOR}"
          (
            cd "$VERIFY_PROJ"
            unset ZIG_LIB_DIR
            "$INSTALLED_CMD" version
            cat > hello.zig <<'EOF'
          const std = @import("std");
          pub fn main() void {
              std.debug.print("installed ok\n", .{});
          }
          EOF
            "$INSTALLED_CMD" build-exe hello.zig -target wasm32-wasi -fno-llvm -femit-bin=hello.wasm
            wasmtime run hello.wasm
          )
          rm -rf "$VERIFY_DIR" "$VERIFY_PROJ"
