name: WASI Component CI

on:
  push:
    branches: [wasi, wabt-component]
  pull_request:
    branches: [wasi, wabt-component]

permissions:
  contents: read

jobs:
  wasm-component:
    name: Build & Test WASI Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0 via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install Wasmtime
        run: |
          curl -sSfL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Cache stage1 bootstrap
        id: cache-zig1
        uses: actions/cache@v4
        with:
          path: .ci-bootstrap/zig1
          key: zig1-v2-${{ runner.os }}-${{ hashFiles('stage1/zig1.wasm', 'stage1/wasm2c.c', 'stage1/wasi.c') }}

      - name: Build stage1 bootstrap (if not cached)
        if: steps.cache-zig1.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-bootstrap
          zig cc -target x86_64-linux-gnu -mcpu=baseline -std=c99 -O2 -fno-sanitize=undefined stage1/wasm2c.c -o .ci-bootstrap/zig-wasm2c
          .ci-bootstrap/zig-wasm2c stage1/zig1.wasm .ci-bootstrap/zig1.c
          zig cc -target x86_64-linux-gnu -mcpu=baseline -std=c99 -O2 -fno-sanitize=undefined -fno-stack-protector -fno-strict-aliasing \
            -Wno-address-of-packed-member -Istage1 .ci-bootstrap/zig1.c stage1/wasi.c -lm -o .ci-bootstrap/zig1
          rm -f .ci-bootstrap/zig1.c .ci-bootstrap/zig-wasm2c

      - name: Build zig-wasm (dev=.wasm)
        run: |
          mkdir -p .ci-bootstrap
          cat << 'EOF' > .ci-bootstrap/build_options_wasm.zig
          pub const mem_leak_frames: u32 = 0;
          pub const have_llvm = false;
          pub const llvm_has_m68k = false;
          pub const llvm_has_csky = false;
          pub const llvm_has_arc = false;
          pub const llvm_has_xtensa = false;
          pub const debug_gpa = false;
          pub const dev = .wasm;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode = .by_name;
          pub const version: [:0]const u8 = "0.18.0-dev.0+wabt";
          pub const semver = @import("std").SemanticVersion.parse(version) catch unreachable;
          pub const enable_debug_extensions = false;
          pub const enable_logging = false;
          pub const log_level: @import("std").log.Level = .err;
          pub const enable_link_snapshots = false;
          pub const enable_tracy = false;
          pub const enable_tracy_callstack = false;
          pub const enable_tracy_allocation = false;
          pub const tracy_callstack_depth: u32 = 6;
          pub const value_tracing = false;
          EOF
          .ci-bootstrap/zig1 lib build-exe -ofmt=c -lc -OReleaseSmall \
            --name zig-wasm \
            -femit-bin=.ci-bootstrap/zig-wasm.c \
            -target x86_64-linux-gnu \
            --dep build_options \
            -Mroot=src/main.zig \
            -Mbuild_options=.ci-bootstrap/build_options_wasm.zig
          zig cc -std=c99 -O0 -fno-sanitize=undefined -fno-stack-protector -fno-strict-aliasing \
            -Wno-address-of-packed-member -Istage1 .ci-bootstrap/zig-wasm.c \
            -lm -lpthread -ldl -o .ci-bootstrap/zig-wasm
          rm -f .ci-bootstrap/zig-wasm.c

      - name: Verify wasm32-wasi baseline
        run: |
          mkdir -p .ci-tmp
          cat << 'EOF' > .ci-tmp/hello.zig
          const std = @import("std");
          pub fn main() void {}
          EOF
          .ci-bootstrap/zig-wasm build-exe --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasi .ci-tmp/hello.zig -femit-bin=.ci-tmp/hello.wasm
          wasmtime run .ci-tmp/hello.wasm

          cat << 'EOF' > .ci-tmp/hello_libc.zig
          const std = @import("std");
          extern "c" fn snprintf(buf: [*]u8, size: usize, fmt: [*:0]const u8, ...) c_int;
          extern "c" fn strtod(nptr: [*:0]const u8, endptr: ?*[*:0]u8) f64;
          extern "c" fn fnmatch(pat: [*:0]const u8, str: [*:0]const u8, flags: c_int) c_int;
          extern "c" fn crypt(key: [*:0]const u8, salt: [*:0]const u8) ?[*:0]u8;
          pub fn main() !void {
              var buf: [128]u8 = undefined;
              const n = snprintf(&buf, buf.len, "wasi-libc: %d %.2f", @as(c_int, 42), strtod("2.50", null));
              try std.testing.expect(n > 0);
              try std.testing.expectEqualStrings("wasi-libc: 42 2.50", buf[0..@intCast(n)]);
              try std.testing.expectEqual(@as(c_int, 0), fnmatch("*.zig", "wasi_libc.zig", 0));
              const hashed = crypt("pass", "$1$salt$") orelse return error.CryptFailed;
              try std.testing.expect(std.mem.startsWith(u8, std.mem.span(hashed), "$1$salt$"));
          }
          EOF
          .ci-bootstrap/zig-wasm build-exe --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasi -lc .ci-tmp/hello_libc.zig -femit-bin=.ci-tmp/hello_libc.wasm
          wasmtime run .ci-tmp/hello_libc.wasm

      - name: Run vendored wabt component tests
        run: |
          .ci-bootstrap/zig-wasm test --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasi --test-cmd wasmtime --test-cmd-bin \
            src/link/Wasm/component/root.zig
          .ci-bootstrap/zig-wasm test --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasip2 --test-cmd wasmtime --test-cmd-bin \
            src/link/Wasm/component/root.zig

      - name: Run std.os.wasi.p2 unit tests
        run: |
          mkdir -p .ci-tmp
          cp lib/std/os/wasi/p2.zig .ci-tmp/p2_test.zig
          .ci-bootstrap/zig-wasm test --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasip2 --test-cmd wasmtime --test-cmd-bin \
            .ci-tmp/p2_test.zig

      - name: Verify wasm32-wasip2 E2E (Debug, ReleaseSmall, and zig test)
        run: |
          mkdir -p .ci-tmp
          .ci-bootstrap/zig-wasm build-exe --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasip2 test/wasip2_e2e.zig -femit-bin=.ci-tmp/wasip2_e2e.wasm
          cmp -n 8 <(printf '\x00asm\x0d\x00\x01\x00') .ci-tmp/wasip2_e2e.wasm
          wasmtime run --dir=.ci-tmp --env TEST_ENV_KEY=wasip2_val .ci-tmp/wasip2_e2e.wasm arg_one arg_two

          .ci-bootstrap/zig-wasm build-exe --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasip2 -OReleaseSmall test/wasip2_e2e.zig -femit-bin=.ci-tmp/wasip2_e2e_small.wasm
          cmp -n 8 <(printf '\x00asm\x0d\x00\x01\x00') .ci-tmp/wasip2_e2e_small.wasm
          wasmtime run --dir=.ci-tmp --env TEST_ENV_KEY=wasip2_val .ci-tmp/wasip2_e2e_small.wasm arg_one arg_two

          .ci-bootstrap/zig-wasm test --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasip2 --test-cmd wasmtime --test-cmd=--dir=. --test-cmd-bin \
            test/wasip2_e2e.zig

      - name: Verify custom WIT reactor and Preview 1 adapter-spliced components
        run: |
          mkdir -p .ci-tmp
          cat << 'EOF' > .ci-tmp/adder.wit
          package example:math@0.1.0;

          world adder {
              export add: func(a: s32, b: s32) -> s32;
          }
          EOF
          cat << 'EOF' > .ci-tmp/adder.zig
          export fn add(a: i32, b: i32) i32 {
              return a + b;
          }
          EOF
          .ci-bootstrap/zig-wasm build-exe --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasip2 -mexec-model=reactor \
            -fwit-path=.ci-tmp/adder.wit -fwit-world=adder \
            .ci-tmp/adder.zig -femit-bin=.ci-tmp/adder.wasm
          cmp -n 8 <(printf '\x00asm\x0d\x00\x01\x00') .ci-tmp/adder.wasm
          out=$(wasmtime run --invoke 'add(40, 2)' .ci-tmp/adder.wasm)
          test "$out" = "42"

          cat << 'EOF' > .ci-tmp/p1_guest.zig
          extern "wasi_snapshot_preview1" fn random_get(buf: [*]u8, buf_len: usize) callconv(.c) u16;
          extern "wasi_snapshot_preview1" fn proc_exit(code: u32) callconv(.c) noreturn;

          export fn _start() void {
              var buf: [16]u8 = @splat(0);
              if (random_get(&buf, buf.len) != 0) @trap();
              var any_nonzero = false;
              for (buf) |b| {
                  if (b != 0) any_nonzero = true;
              }
              if (!any_nonzero) @trap();
              proc_exit(0);
          }
          EOF
          .ci-bootstrap/zig-wasm build-exe --zig-lib-dir lib -fno-llvm -fno-lld \
            -target wasm32-wasip2 .ci-tmp/p1_guest.zig -femit-bin=.ci-tmp/p1_guest.wasm
          cmp -n 8 <(printf '\x00asm\x0d\x00\x01\x00') .ci-tmp/p1_guest.wasm
          wasmtime run .ci-tmp/p1_guest.wasm
