name: lint-libc-migration

on:
  push:
    branches:
      - '0.17.0-libc*'
      - 'libc17-704*'
      - 'libc/**'
    paths:
      - src/libs/musl.zig
      - lib/c/**
      - test/libc.zig
      - test/src/Libc.zig
      - scripts/check_musl_migration.py
      - .github/workflows/lint-libc-migration.yml
      - .github/workflows/pr-build.yml
  pull_request:
  workflow_dispatch:

jobs:
  check-migration-claims:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ubuntu2604"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.environment != 'self-hosted'
        with:
          python-version: "3.11"
      - name: Check musl.zig "migrated to" claims
        run: python3 scripts/check_musl_migration.py
